services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_BACKEND: duckdb
      DUCKDB_PATH: data/processed/enterprise_copilot.duckdb
      LLM_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - copilot-data:/workspace/data/processed
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 5
  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  copilot-data:
