services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_BACKEND: duckdb
      DUCKDB_PATH: data/processed/enterprise_copilot.duckdb
      LLM_PROVIDER: mock
    volumes:
      - .:/workspace
  web:
    image: node:22-slim
    working_dir: /workspace/web
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_BASE_URL: http://api:8000
    volumes:
      - .:/workspace
    depends_on:
      - api
